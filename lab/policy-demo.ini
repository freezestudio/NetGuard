[general]
DefaultDeny=1
AllowDhcp=1
AllowLoopback=1
TempAllowUntil=0

; 业务地址：医保前置
[ep.1]
Name=医保前置
Cidr=10.10.10.10/32
Ports=8000-8005
Proto=TCP
Enable=1

; 业务地址：门店打印机
[ep.2]
Name=门店打印机
Cidr=192.168.1.50/32
Ports=9100
Proto=TCP
Enable=1

; 业务程序：只有它才能访问上面这些地址
[proc.1]
Name=医保客户端(演示用记事本)
Path=C:\Windows\System32\notepad.exe
Sha256=
Endpoint=医保前置
Enable=1
